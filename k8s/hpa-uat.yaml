apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: hrs-order-service-hpa
    namespace: uat
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: hrs-order-service
    minReplicas: 1
    maxReplicas: 3
    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 50
        - type: Resource
          resource:
              name: memory
              target:
                  type: Utilization
                  averageUtilization: 70
    behavior:
        scaleDown:
            stabilizationWindowSeconds: 60
            policies:
                - type: Percent
                  value: 50
                  periodSeconds: 15
        scaleUp:
            stabilizationWindowSeconds: 0
            policies:
                - type: Percent
                  value: 100
                  periodSeconds: 15
                - type: Pods
                  value: 2
                  periodSeconds: 15
            selectPolicy: Max
